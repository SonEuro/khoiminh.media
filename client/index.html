<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Khôi Minh Media" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0a0a14" />
    <meta name="zalo-platform-site-verification" content="Glgw5x_ARa5_kTbAYuWDKswjldM2ssGgCJCr" />
    <title>Khôi Minh Media</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192.png" />
    <style>
      #app-loading{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a0a14;gap:20px}
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>
  </head>
  <body>
    <div id="app-loading">
      <img src="/logo.png" alt="Khôi Minh" style="width:140px;opacity:0.9" />
      <div style="width:36px;height:36px;border:3px solid rgba(201,168,76,0.25);border-top-color:#c9a84c;border-radius:50%;animation:spin 0.8s linear infinite"></div>
    </div>
    <div id="root"></div>
    <script>
      (function(){
        var el = document.getElementById('app-loading');
        var root = document.getElementById('root');
        var obs = new MutationObserver(function(){
          if(root.children.length > 0){ el.style.display='none'; obs.disconnect(); }
        });
        obs.observe(root, {childList:true});
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
