# Nginx reverse proxy cho Kho Khôi Minh
# Server: 103.15.51.119
# App: Node.js trên port 3001
#
# Cài đặt:
#   cp deploy/nginx.conf /etc/nginx/sites-available/kho-khoiminh
#   sed -i 's/YOUR_DOMAIN_HERE/khoiminhmedia.com www.khoiminhmedia.com/g' /etc/nginx/sites-available/kho-khoiminh
#   ln -s /etc/nginx/sites-available/kho-khoiminh /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name YOUR_DOMAIN_HERE 103.15.51.119;

    # Upload tối đa 50MB (ảnh báo cáo sự kiện)
    client_max_body_size 50m;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }
}

# Block SSL được certbot tự thêm vào sau khi chạy:
#   certbot --nginx -d YOUR_DOMAIN_HERE
