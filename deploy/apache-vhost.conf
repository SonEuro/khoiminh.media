# Dán vào Apache vhost config của kho.ehntfovk.vn trong DirectAdmin
# Thường ở: /etc/httpd/conf/extra/httpd-vhosts.conf
# hoặc: /usr/local/directadmin/data/users/[user]/domains/kho.ehntfovk.vn.conf

<VirtualHost *:80>
    ServerName kho.ehntfovk.vn
    DocumentRoot /home/ehntfovk/domains/kho.ehntfovk.vn/public_html

    # Proxy API sang Node.js
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass /api http://127.0.0.1:3001/api
    ProxyPassReverse /api http://127.0.0.1:3001/api

    <Directory /home/ehntfovk/domains/kho.ehntfovk.vn/public_html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog  /home/ehntfovk/domains/kho.ehntfovk.vn/logs/error.log
    CustomLog /home/ehntfovk/domains/kho.ehntfovk.vn/logs/access.log combined
</VirtualHost>
