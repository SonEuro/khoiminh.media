name: Deploy to VPS

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to 103.15.51.119
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: |
          cd client
          npm install
          npm run build
          cd ..
          rm -rf server/public
          cp -r client/dist server/public

      - name: Backup DB on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 103.15.51.119
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            DB=/var/www/kho-khoiminh/server/kho.db
            BAK_DIR=/var/backups/kho-khoiminh/deploy
            mkdir -p "$BAK_DIR"
            if [ -f "$DB" ]; then
              STAMP=$(date +%Y%m%d_%H%M%S)
              cp "$DB" "$BAK_DIR/kho_${STAMP}.db"
              echo "✅ Backup OK: kho_${STAMP}.db ($(du -h "$BAK_DIR/kho_${STAMP}.db" | cut -f1))"
              ls -t "$BAK_DIR"/kho_*.db | tail -n +11 | xargs rm -f 2>/dev/null || true
              ls -lh "$BAK_DIR"
            else
              echo "⚠️ kho.db chưa tồn tại, bỏ qua backup"
            fi

      - name: Deploy via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete --exclude='.git' --exclude='node_modules' --exclude='server/kho.db' --exclude='server/db.sqlite' --exclude='server/*.bak' --exclude='.env' --exclude='server/node_modules' --exclude='server/uploads/'
          path: ./
          remote_path: /var/www/kho-khoiminh/
          remote_host: 103.15.51.119
          remote_user: root
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Reload PM2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 103.15.51.119
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /var/www/kho-khoiminh

            echo "━━━ npm install ━━━"
            cd /var/www/kho-khoiminh/server
            npm install --omit=dev
            npm install web-push --omit=dev

            echo "━━━ Reload PM2 ━━━"
            cd /var/www/kho-khoiminh
            fuser -k 3001/tcp 2>/dev/null || true
            pm2 delete kho-khoiminh 2>/dev/null || true
            pm2 start /var/www/kho-khoiminh/ecosystem.config.cjs
            pm2 save

            echo ""
            echo "━━━ PM2 log rotation ━━━"
            pm2 install pm2-logrotate 2>/dev/null || true
            pm2 set pm2-logrotate:max_size 50M
            pm2 set pm2-logrotate:retain 30
            pm2 set pm2-logrotate:compress true
            pm2 set pm2-logrotate:dateFormat YYYY-MM-DD
            pm2 set pm2-logrotate:rotateInterval '0 0 * * *'

            echo ""
            echo "✅ Deploy thành công!"
            pm2 list
