name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to 103.15.51.119
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: |
          cd client
          npm install
          npm run build
          cd ..
          rm -rf server/public
          cp -r client/dist server/public

      - name: Pre-deploy database backup
        timeout-minutes: 2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 103.15.51.119
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 90s
          script: |
            DB_PATH=$(grep '^DATABASE_PATH=' /var/www/kho-khoiminh/.env 2>/dev/null | cut -d'=' -f2-)
            DB_PATH="${DB_PATH:-/var/www/kho-khoiminh/server/kho.db}"
            mkdir -p /var/db/deploy-backups
            if [ -f "$DB_PATH" ]; then
              DEST="/var/db/deploy-backups/pre-deploy-$(date +%Y%m%d_%H%M%S).db"
              cp "$DB_PATH" "$DEST"
              ls -t /var/db/deploy-backups/pre-deploy-*.db 2>/dev/null | tail -n +21 | xargs rm -f || true
              echo "✅ Pre-deploy backup: $DEST"
            else
              echo "⚠️  DB không tìm thấy, bỏ qua backup"
            fi

      - name: Deploy via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete --exclude='.git' --exclude='node_modules' --exclude='server/kho.db' --exclude='server/db.sqlite' --exclude='server/*.bak' --exclude='.env'
          path: ./
          remote_path: /var/www/kho-khoiminh/
          remote_host: 103.15.51.119
          remote_user: root
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Reload PM2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 103.15.51.119
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /var/www/kho-khoiminh

            echo "━━━ Cài server dependencies ━━━"
            cd server && npm install && cd ..

            echo "━━━ Reload PM2 ━━━"
            pm2 reload kho-khoiminh --update-env
            pm2 save

            echo ""
            echo "✅ Deploy thành công!"
            pm2 list
